<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
        }
        
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
            flex-wrap: wrap;
        }
        
        .gallery img {
            border: 5px solid #ccc;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        
        .gallery img:hover {
            transform: scale(1.05);
            border-color: #555;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 40px;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-size: 18px;
            margin-top: 10px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Моя галерея</h1>
    
    <div class="gallery">
        <img src="../photo/photo1.jpg" alt="Фото 1" width="300">
        <img src="../photo/photo2.jpg" alt="Фото 2" width="300">
    </div>

    <h2>Назад</h2>
    <a href="../index.html" class="back-link">На головну</a>
</body>
</html>
